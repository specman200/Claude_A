# ---------------------------------------------------------------------------
# PPE detection station — edit this file (or the UI's Settings panel) to
# reconfigure the app. Nothing else needs to change.
# ---------------------------------------------------------------------------

model:
  # OpenVINO IR — about 5x faster than the .pt on an Intel CPU for the same
  # detections. Regenerate for a different imgsz with `python -m ppe.export`,
  # or point this at models/ppe-yolo11s.pt to run PyTorch directly.
  weights: models/ppe-yolo11s_openvino_model/
  imgsz: 640            # must match what the model was exported at
  device: auto          # auto | cpu | cuda:0 | mps
  half: true            # fp16 — CUDA only, ignored elsewhere
  conf: 0.35            # global confidence floor
  iou: 0.50             # NMS IoU
  max_det: 100
  warmup: true          # run a dummy batch at startup so frame 1 is not slow
  threads: 0            # inference threads; 0 = every core this process may use
  batch: auto           # auto | true | false — batch both cameras in one call?

cameras:
  # fourcc: MJPG asks the camera to compress its own output before it hits
  # the wire. Leaving this at the driver's default usually means raw YUY2 —
  # ~55 MB/s per camera at 1280x720@30, more than one USB 2.0 port carries,
  # let alone two sharing a hub. MJPG cuts that to a few MB/s. Leave "" only
  # if a specific camera does not support it (rare on any modern UVC webcam).
  - name: Line A
    source: 0           # index, RTSP/HTTP URL, or video file path
    width: 1280         # requested capture size (see docs/accuracy note)
    height: 720
    fps: 30
    # A reference station running these same C920s on Windows uses DirectShow
    # explicitly rather than letting OpenCV choose (it usually picks MSMF).
    # On Windows try `dshow` first; on Linux use `v4l2` or leave `any`.
    api: any            # any | v4l2 (Linux) | dshow | msmf (Windows) | ffmpeg
    fourcc: MJPG
  - name: Line B
    source: 1
    width: 1280
    height: 720
    fps: 30
    api: any
    fourcc: MJPG

ppe:
  # The UI lists these in order. `name` must match the model's class name.
  #   required: true   -> this class gates the tower light
  #   expect: present  -> the item must be worn (the default)
  #   expect: absent   -> detecting it IS the violation
  #   count: N         -> N of them must be on the subject (default 1)
  #   conf / hold_ms   -> per-class overrides of model.conf and ppe.hold_ms
  #
  # The conf and hold_ms values below come from a station running this same
  # model on real hardware. Note the shape of them: `person` has a low floor
  # (find the subject easily), worn PPE sits high (be strict about crediting
  # equipment), and `Wrong Sleeve` is highest of all — a false positive there
  # is a spurious red light, which is the thing that gets a station ignored.
  classes:
    - {name: headnet,       label: Head Net,       required: true, conf: 0.50, hold_ms: 800}
    - {name: Safetyglasses, label: Safety Glasses, required: true, conf: 0.60, hold_ms: 1100}
    - {name: Mask,          label: Face Mask,      required: true, conf: 0.60, hold_ms: 700}
    - {name: Gloves,        label: Gloves,         required: true, conf: 0.60, hold_ms: 1000, count: 2}
    - {name: sleeves,       label: Sleeves,        required: true, conf: 0.75, hold_ms: 1200, count: 2}
    - {name: Wrong Sleeve,  label: Wrong Sleeve,   required: true, conf: 0.90, hold_ms: 400, expect: absent}
    - {name: person,        label: Person in Cell, required: false, conf: 0.25, hold_ms: 1000}

  # PPE only means anything relative to a person. With `subject` set, the
  # station checks the LARGEST detection of that class (the one nearest the
  # camera, per camera) and only counts equipment found on them; with nobody
  # in view it goes to STANDBY instead of reporting missing PPE.
  # Leave `subject` empty to check every detection, wherever it is.
  subject: person
  containment: 0.5      # fraction of a PPE box that must lie on the subject
  hold_ms: 1500         # default hold for classes that do not set their own

  # How long a status must hold before the lamp follows it, in seconds.
  # Asymmetric on purpose: slow to claim compliance, quick to raise an alarm.
  confirm_sec:
    ok: 1.0             # slow to go green
    violation: 0.4      # quick to go red
    standby: 1.0        # slow to conclude nobody is there
    degraded: 0.5

tower:
  enabled: true
  transport: tcp        # tcp | rtu
  host: 192.168.1.50    # tcp
  port: 502             # tcp
  serial_port: /dev/ttyUSB0   # rtu
  baudrate: 9600        # rtu
  unit: 1               # modbus slave / device id
  timeout: 0.5          # seconds
  coils:                # coil address of each relay channel
    green: 0
    amber: 1
    red: 2
    buzzer: 3
  buzzer_on_violation: false

audio:
  # Spoken prompt while a violation stands — a lamp only works on someone
  # facing it. Leave `file` empty for a silent station.
  # `grace_sec` is a deliberate pause before the first prompt: nagging the
  # instant PPE is missing trains people to ignore it, so give them time to
  # finish putting the glove on first.
  file: ""              # e.g. assets/please_wear_ppe.mp3
  grace_sec: 3.0
  repeat_sec: 3.0

branding:
  # Shown in the app's side panel and used as the window icon.
  # Point `logo` at your own .svg/.png to replace the placeholder mark;
  # a relative path resolves from this file. Leave `name` empty to hide it.
  name: Your Name
  tagline: Computer Vision & Industrial Automation
  logo: assets/logo.svg

telemetry:
  csv: logs/latency.csv # per-cycle end-to-end log; empty string disables
  window: 300           # samples kept for the rolling p50/p95 readout
  print_every: 0.0      # seconds between console summaries; 0 disables
