# ---------------------------------------------------------------------------
# PPE detection station — edit this file (or the UI's Settings panel) to
# reconfigure the app. Nothing else needs to change.
# ---------------------------------------------------------------------------

model:
  weights: models/ppe-yolo11s.pt   # fine-tuned yolo11s; see README for the classes
  imgsz: 640            # matches the size the model was trained at
  device: auto          # auto | cpu | cuda:0 | mps
  half: true            # fp16 — ignored on CPU
  conf: 0.35            # global confidence floor
  iou: 0.50             # NMS IoU
  max_det: 100
  warmup: true          # run a dummy batch at startup so frame 1 is not slow

cameras:
  - name: Line A
    source: 0           # index, RTSP/HTTP URL, or video file path
    width: 1280         # requested capture size (see docs/accuracy note)
    height: 720
    fps: 30
    api: any            # any | v4l2 | dshow | ffmpeg
  - name: Line B
    source: 1
    width: 1280
    height: 720
    fps: 30
    api: any

ppe:
  # The UI lists these in order. `name` must match the model's class name.
  #   required: true   -> this class gates the tower light
  #   expect: present  -> the item must be worn (the default)
  #   expect: absent   -> detecting it IS the violation
  classes:
    - {name: headnet,       label: Head Net,       required: true}
    - {name: Safetyglasses, label: Safety Glasses, required: true}
    - {name: Mask,          label: Face Mask,      required: true}
    - {name: Gloves,        label: Gloves,         required: true}
    - {name: sleeves,       label: Sleeves,        required: true}
    - {name: Wrong Sleeve,  label: Wrong Sleeve,   required: true, expect: absent}
    - {name: person,        label: Person in Cell, required: false}
  # PPE only means anything relative to a person. With `subject` set, the
  # station checks the LARGEST detection of that class (the one nearest the
  # camera, per camera) and only counts equipment found on them; with nobody
  # in view it goes to STANDBY instead of reporting missing PPE.
  # Leave `subject` empty to check every detection, wherever it is.
  subject: person
  containment: 0.5      # fraction of a PPE box that must lie on the subject
  hold_ms: 1500         # a class stays lit this long after its last sighting
  confirm_frames: 3     # consecutive agreeing evaluations before the light flips

tower:
  enabled: true
  transport: tcp        # tcp | rtu
  host: 192.168.1.50    # tcp
  port: 502             # tcp
  serial_port: /dev/ttyUSB0   # rtu
  baudrate: 9600        # rtu
  unit: 1               # modbus slave / device id
  timeout: 0.5          # seconds
  coils:                # coil address of each relay channel
    green: 0
    amber: 1
    red: 2
    buzzer: 3
  buzzer_on_violation: false

telemetry:
  csv: logs/latency.csv # per-cycle end-to-end log; empty string disables
  window: 300           # samples kept for the rolling p50/p95 readout
  print_every: 0.0      # seconds between console summaries; 0 disables
