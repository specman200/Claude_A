<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3a4656"/></marker></defs>
  <style>
    .b{fill:#f3f5f8;stroke:#3a4656;stroke-width:1.4}.d{fill:#ffffff;stroke:#3a4656;stroke-width:1.4}
    .ok{fill:#e8f5ee;stroke:#1e7a4c;stroke-width:1.4}.bad{fill:#fdecea;stroke:#b42318;stroke-width:1.4}.amb{fill:#fff4e0;stroke:#b26a00;stroke-width:1.4}.sb{fill:#eceff3;stroke:#5b6b82;stroke-width:1.4}
    .h{fill:#0b1f3a;font-size:13px;font-weight:bold}.t{fill:#0b1f3a;font-size:11.5px}.s{fill:#5b6b82;font-size:10.5px}
    .l{stroke:#3a4656;stroke-width:1.5;fill:none;marker-end:url(#ar)}.y{fill:#3a4656;font-size:10.5px;font-weight:bold}
  </style>
  <rect width="960" height="600" fill="#ffffff"/>
  <rect class="b" x="20" y="20" width="250" height="58" rx="6"/><text class="h" x="32" y="42">Detections, one camera</text><text class="s" x="32" y="60">per-class confidence floors applied (0.25-0.90)</text>
  <rect class="b" x="20" y="100" width="250" height="58" rx="6"/><text class="h" x="32" y="122">Subject = largest person box</text><text class="s" x="32" y="140">chosen independently per camera</text>
  <rect class="b" x="20" y="180" width="250" height="70" rx="6"/><text class="h" x="32" y="202">Containment test</text><text class="t" x="32" y="220">share of item box inside subject box</text><text class="s" x="32" y="238">0.5 default; gloves 0.1; sleeves 0.3</text>
  <rect class="b" x="20" y="272" width="250" height="70" rx="6"/><text class="h" x="32" y="294">Count per class</text><text class="t" x="32" y="312">best single camera, never the sum</text><text class="s" x="32" y="330">credited count, not raw count</text>
  <rect class="b" x="20" y="364" width="250" height="86" rx="6"/><text class="h" x="32" y="386">Hold and occlusion windows</text><text class="t" x="32" y="404">none seen: hold_ms (0.4-1.2 s)</text><text class="t" x="32" y="422">some seen: occluded_ms (5 s)</text><text class="s" x="32" y="440">gloves and sleeves only</text>
  <path class="l" d="M145 78 V100"/><path class="l" d="M145 158 V180"/><path class="l" d="M145 250 V272"/><path class="l" d="M145 342 V364"/>
  <path class="l" d="M270 407 H300 V60 H330"/>
  <rect class="d" x="330" y="30" width="250" height="60" rx="6"/><text class="h" x="342" y="52">Every required class known</text><text class="h" x="342" y="70">to the loaded model?</text>
  <rect class="amb" x="640" y="30" width="140" height="44" rx="6"/><text class="h" x="652" y="57">DEGRADED</text>
  <path class="l" d="M580 52 H640"/><text class="y" x="596" y="46">no</text>
  <rect class="d" x="330" y="120" width="250" height="50" rx="6"/><text class="h" x="342" y="150">Subject present (with hold)?</text>
  <rect class="sb" x="640" y="123" width="140" height="44" rx="6"/><text class="h" x="652" y="150">STANDBY</text>
  <path class="l" d="M455 90 V120"/><text class="y" x="462" y="110">yes</text>
  <path class="l" d="M580 145 H640"/><text class="y" x="596" y="139">no</text>
  <rect class="d" x="330" y="200" width="250" height="70" rx="6"/><text class="h" x="342" y="222">All required satisfied?</text><text class="s" x="342" y="242">count reached, forbidden class absent,</text><text class="s" x="342" y="258">or another any_of member compliant</text>
  <path class="l" d="M455 170 V200"/><text class="y" x="462" y="190">yes</text>
  <rect class="ok" x="640" y="200" width="140" height="44" rx="6"/><text class="h" x="652" y="227">OK</text>
  <rect class="bad" x="640" y="256" width="140" height="44" rx="6"/><text class="h" x="652" y="283">VIOLATION</text>
  <path class="l" d="M580 222 H640"/><text class="y" x="596" y="216">yes</text>
  <path class="l" d="M580 250 H610 V278 H640"/><text class="y" x="586" y="266">no</text>
  <rect class="b" x="330" y="330" width="450" height="66" rx="6"/><text class="h" x="342" y="352">Debounce: candidate must stand for confirm_sec</text><text class="t" x="342" y="372">OK 1.0 s, VIOLATION 0.4 s, STANDBY 1.0 s, DEGRADED 0.5 s</text><text class="s" x="342" y="388">asymmetric: slow to go green, quick to go red</text>
  <path class="l" d="M780 52 H880 V363 H780"/><path class="l" d="M780 145 H880"/><path class="l" d="M780 222 H880"/><path class="l" d="M780 278 H880"/>
  <rect class="b" x="330" y="420" width="450" height="160" rx="6"/><text class="h" x="342" y="442">Motor permissive latch (update_belt_grinder)</text>
  <text class="t" x="342" y="464">1. Input unreadable or e-stop hit: drop latch now</text>
  <text class="t" x="342" y="484">2. Button pressed while running: drop latch (stop)</text>
  <text class="t" x="342" y="504">3. OK: cancel countdown; a fresh press starts the motor</text>
  <text class="t" x="342" y="524">4. VIOLATION on a running motor: countdown of the shortest grace_sec</text>
  <text class="t" x="342" y="542">    among faulting classes (0 s gloves, glasses, wrong sleeve; 5 s others)</text>
  <text class="t" x="342" y="562">5. Anything else (STANDBY, DEGRADED, expired countdown): drop latch</text>
  <path class="l" d="M555 396 V420"/>
  <text class="s" x="20" y="480">Nothing restarts the motor on its own:</text>
  <text class="s" x="20" y="496">every drop needs a new release-then-press</text>
  <text class="s" x="20" y="512">of the push button with status OK.</text>
</svg>
